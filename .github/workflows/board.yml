# Mirrors the whiteboard issues and the cafeteria chat into board.json on every issue or comment,
# so the office page reads them from GitHub Pages (no API rate limit for viewers).
name: Office board mirror
on:
  issues:
  issue_comment:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: board-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write board.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/mirror.js
      - name: Commit and push
        id: push
        run: |
          git add board.json
          if git diff --cached --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c user.name='office-board-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m 'board: mirror whiteboard and cafeteria chat'
          for i in 1 2 3 4 5; do git push -q && break; sleep 3; git pull -q --rebase; done
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Request a Pages build
        if: steps.push.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
