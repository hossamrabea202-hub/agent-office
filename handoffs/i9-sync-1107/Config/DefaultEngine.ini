[SystemSettings]
; --- Claude AAA performance pass ---
; Dynamic resolution + TSR upscaling: holds 60 fps by lowering internal res under load
r.DynamicRes.OperationMode=2
; 2026-10-24 Quadro T1000 pass: 60 fps is out of reach on a 4 GB T1000 (base frame ~88 ms), so target 30 fps and never drop below 60% (50% was a blur)
r.DynamicRes.FrameTimeBudget=33.3
r.DynamicRes.MinScreenPercentage=55
r.DynamicRes.MaxScreenPercentage=67
; 2026-11-03 Alien OK: render at 67% (TSR upscales to native), dynamic res may drop to 55% under load. Measured on the T1000: res is the biggest GPU lever.
r.ScreenPercentage=67
; light sharpen so TSR at 67% does not read soft
r.Tonemapper.Sharpen=0.6
; Cascaded shadow maps 1024 (also set per quality level in DefaultScalability.ini): ShadowDepths 34 ms -> 7 ms
r.Shadow.MaxCSMResolution=1024
; Virtual shadow maps: cache static geometry separately (castle is static)
r.Shadow.Virtual.Cache.StaticSeparate=1
; Texture streaming on with a sane pool
r.TextureStreaming=1
; Video memory budget for 4 GB cards
r.Nanite.Streaming.StreamingPoolSize=384
; 2048 ran out of pages with the mountains and dropped character/zombie shadows; 4096 is the engine default
r.Shadow.Virtual.MaxPhysicalPages=4096
; Lumen surface cache atlas 4096 -> 2048 (~300 MB less VRAM per rendered world, same lighting style)
r.LumenScene.SurfaceCache.AtlasSize=4096
; Texture streaming budget: the game only uses ~320 MB of textures, scalability default was 1800
r.Streaming.PoolSize=700
; 4 GB GPU + editor: cap the pool to what the card can hold
r.Streaming.LimitPoolSizeToVRAM=1
; --- PostFX pass 10-27 ---
; 37: slight panini projection keeps the 90 deg FOV edges from stretching
r.Upscale.Panini.D=0.1
; 41: TSR stability on thin parapet/grass detail, faster flicker rejection, less ghosting on fast zombies/flags
r.TSR.History.SampleCount=24
r.TSR.ShadingRejection.Flickering.Period=2
r.TSR.Velocity.Extrapolation=1
; --- 2026-11-02 i9 perf pass (median GPU profiles in PIE) ---
; cloud shadow map cost 13-15 ms per frame on the T1000 (25% of the frame); clouds still render, only their ground shadows go
r.VolumetricCloud.ShadowMap=0
; Lumen: half the screen probes + coarser radiosity probes, Lumen lighting 7 -> 3.3 ms, same look
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.LumenScene.Radiosity.ProbeSpacing=8
; 3 sun shadow cascades instead of 4
r.Shadow.CSM.MaxCascades=3
; Nanite back to 1 px per edge (2 looked pixelated, Alien 11-02)
r.Nanite.MaxPixelsPerEdge=1
; sun shadow distance 80%
r.Shadow.DistanceScale=0.8
; volumetric fog depth slices 128 -> 64 (fog 3 -> 0.6 ms, god rays keep their shape)
r.VolumetricFog.GridSizeZ=64

