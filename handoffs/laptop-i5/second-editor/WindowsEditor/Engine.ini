; laptop-i5 (MX570 2 GB, 16 GB RAM) editor-only low settings, #399.
; Drop into <project>/Saved/Config/WindowsEditor/. Local only: never Project Settings or DefaultEngine.ini.
[SystemSettings]
r.ScreenPercentage=50
r.Streaming.PoolSize=1000
t.MaxFPS=30
; Lumen + VSM off locally (GI none, SSR reflections, shadow maps)
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Lumen.DiffuseIndirect.Allow=0
r.Shadow.Virtual.Enable=0
r.RayTracing.Enable=0
r.Nanite.MaxPixelsPerEdge=2
r.ShaderCompiler.JobCacheDDC=1
