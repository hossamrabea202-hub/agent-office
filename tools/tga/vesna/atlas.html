<!doctype html>
<!-- T_VT_Atlas (#361): every cell of layout.py's atlas. Text cells are white (the game tints them), sprites are in colour.
     Rendered at device scale S on a transparent page -> 2048 x 2048. ?grid=1 shows cell borders. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<script src="layout.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1783px;height:1783px;overflow:hidden;background:transparent}
.c{position:absolute;display:flex;align-items:center;white-space:nowrap;overflow:visible;color:#fff;line-height:1}
.grid .c{outline:1px solid rgba(255,0,0,.6)}
svg{display:block}
</style></head><body><script>
const A=L.atlas, grid=new URLSearchParams(location.search).get('grid'); if(grid) document.body.className='grid';
const W='#fff', G='#d9b46a';
const GL={ // engraved line icons for the pieces that have no art yet (128 cells)
 helm:'M34 92V56a30 30 0 0 1 60 0v36l-12 10H46z M64 26v70 M44 62h40 M50 74h28',
 rerebrace:'M44 20h40l-4 88H48z M44 44h40 M46 68h36 M47 90h34 M56 20c0-6 16-6 16 0',
 vambrace:'M46 18h36l8 92H38z M42 52h44 M40 84h48 M58 30h12v12H58z',
 fauld:'M18 40h92v14H18z M24 54l-4 40h30l4-40 M54 54v42h20V54 M104 54l4 40H78l-4-40 M58 44h12v6H58z',
 cuisses:'M40 16h48l-6 72H46z M46 88l2 24h32l2-24 M42 40h44 M44 64h40',
 cape:'M30 22h68l6 12-10 82-30-10-30 10-10-82z M64 22v80 M44 40l-6 64 M84 40l6 64',
 shield:'M64 14l42 14v30c0 30-20 46-42 56C42 104 22 88 22 58V28z M64 14v100 M28 58h72',
};
function cell(k,r){ const d=document.createElement('div'); d.className='c'; d.style.cssText+=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;`;
  const t=r.p, cz='font-family:Cinzel;', cg="font-family:'Cormorant Garamond';";
  switch(r.kind){
   case 'name': d.style.cssText+=cg+'font-size:21px;font-weight:600'; d.textContent=t; break;
   case 'def':  d.style.cssText+=cg+'font-size:16px;font-weight:600;letter-spacing:.5px'; d.textContent=t; break;
   case 'title':d.style.cssText+=cz+'font-size:26px;font-weight:600;letter-spacing:2.5px;justify-content:center'; d.textContent=t; break;
   case 'tag':  d.style.cssText+='justify-content:center'; d.innerHTML=`<span style="${cz}font-size:12.5px;letter-spacing:1.2px;border:1px solid rgba(255,255,255,.55);padding:4px 14px 4px;background:rgba(255,255,255,.04)">${t}</span>`; break;
   case 'tier': d.style.cssText+=cg+'font-size:17px;font-weight:600'; d.innerHTML=`<svg width="16" height="16" style="margin-right:12px"><path d="M8 1l7 7-7 7-7-7z" fill="none" stroke="#fff" stroke-width="1.6"/></svg>`+t.replace(' ','&nbsp;&nbsp;'); break;
   case 'tab':  { const i=+k.slice(3); const ic=['','M4 22V12a10 10 0 0 1 20 0v10l-4 3h-12z M14 4v19 M8 14h12','M14 3a4 4 0 0 1 4 4v3h-8V7a4 4 0 0 1 4-4z M8 12h12l2 8-3 1-1 7h-8l-1-7-3-1z','M11 3h6 M12 3v6l-6 11a3 3 0 0 0 3 5h10a3 3 0 0 0 3-5l-6-11V3 M8 18h12'][i];
     d.style.cssText+=`justify-content:center;gap:14px;border:1.5px solid ${G};background:linear-gradient(180deg,#5b4522,#2b2012);box-shadow:inset 0 0 12px rgba(255,210,130,.25)`;
     d.innerHTML=(ic?`<svg width="28" height="28"><path d="${ic}" fill="none" stroke="#f0d391" stroke-width="1.8" stroke-linejoin="round"/></svg>`:'')+`<span style="${cz}font-size:17px;font-weight:700;letter-spacing:3px;color:#f6e7c4">${t}</span>`; break; }
   case 'rtab': d.style.cssText+=`justify-content:center;border:1.5px solid ${G};border-bottom:none;background:linear-gradient(180deg,#5b4522,#2b2012);${cz}font-size:16px;font-weight:700;letter-spacing:2.5px;color:#f6e7c4`; d.textContent=t; break;
   case 'rsel': d.style.cssText+=`border:2px solid #f0c66e;border-radius:3px;box-shadow:0 0 12px rgba(240,198,110,.75),inset 0 0 18px rgba(240,198,110,.22);background:rgba(90,70,35,.18)`; break;
   case 'slotsel': d.style.cssText+=`border:2px solid #f0c66e;border-radius:3px;box-shadow:0 0 10px rgba(240,198,110,.8),inset 0 0 12px rgba(240,198,110,.3)`; break;
   case 'setpiece': d.style.cssText+=`justify-content:center;background:linear-gradient(180deg,#e2bd6c,#b8903f);${cz}font-size:12.5px;font-weight:700;letter-spacing:1px;color:#1a120a`; d.textContent=t; break;
   case 'state': { const col=t==='FORGING'?'#8d8476':'#d9b46a', mark=t==='OWNED'?`<svg width="18" height="16" style="margin-right:7px"><path d="M2 8l5 5 9-11" fill="none" stroke="#8fd14f" stroke-width="2.6" stroke-linecap="round"/></svg>`:
       t==='WORN'?`<svg width="12" height="12" style="margin-right:8px"><path d="M6 0l6 6-6 6-6-6z" fill="#d9b46a"/></svg>`:'';
     d.style.cssText+=`justify-content:flex-end;${cz}font-size:15px;font-weight:600;letter-spacing:1px;color:${col}`; d.innerHTML=mark+t; break; }
   case 'btn': d.style.cssText+= t==='on' ? `border:1.5px solid #f3d58e;background:linear-gradient(180deg,#d8b260 0%,#a98535 45%,#7e5f22 100%);box-shadow:inset 0 1px 0 rgba(255,240,200,.6),inset 0 -6px 14px rgba(60,40,10,.45),0 0 16px rgba(217,180,106,.35)`
       : `border:1.5px solid #6a5634;background:linear-gradient(180deg,#3b342a,#221e19);box-shadow:inset 0 1px 0 rgba(255,240,200,.12)`; break;
   case 'key': d.style.cssText+=`justify-content:center;border:1px solid #d9b46a;border-radius:3px;background:#0d0c0b;${cz}font-size:15px;font-weight:600;color:#ece2cf`; d.textContent=t; break;
   case 'dot': d.innerHTML= t==='on'?`<svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#f0c66e"/><circle cx="6" cy="6" r="5.6" fill="none" stroke="rgba(255,220,140,.5)"/></svg>`:`<svg width="12" height="12"><circle cx="6" cy="6" r="3" fill="#6f6658"/></svg>`; break;
   case 'coin': d.innerHTML=`<svg width="22" height="22"><circle cx="11" cy="11" r="9" fill="#c8963a" stroke="#f3d27c" stroke-width="1.4"/><circle cx="11" cy="11" r="5.6" fill="none" stroke="#7a5418" stroke-width="1.1"/></svg>`; break;
   case 'msg': d.style.cssText+=cg+'font-size:19px;font-weight:600;font-style:italic;justify-content:center'; d.textContent=t; break;
   case 'msg2': d.style.cssText+=cz+'font-size:15px;font-weight:600;letter-spacing:1.5px;justify-content:center'; d.textContent=t; break;
   case 'tierrow': d.style.cssText+=`border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.05)`; break;
   case 'glyph': d.innerHTML=`<svg width="128" height="128"><path d="${GL[t]}" fill="rgba(217,180,106,.08)" stroke="#d9b46a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`; break;
  }
  document.body.appendChild(d);
}
Object.entries(A).forEach(([k,r])=>cell(k,r));
</script></body></html>
